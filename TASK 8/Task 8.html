<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BrainSpark Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 520px;
    padding: 35px 30px;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .screen { display: none; }
  .screen.active { display: block; }

  h1 {
    text-align: center;
    color: #2575fc;
    margin-bottom: 5px;
    font-size: 28px;
  }
  p.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #444;
    margin: 15px 0 5px;
    font-weight: 600;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: #2575fc;
  }
  .btn {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,117,252,0.4); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.secondary {
    background: #f0f0f0;
    color: #333;
  }
  #loginError {
    color: #e63946;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
  }

  /* Quiz header */
  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .quiz-top .userTag {
    font-size: 13px;
    color: #555;
  }
  .timer {
    background: #2575fc;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
  }
  .timer.warning { background: #e63946; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }

  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    width: 10%;
    transition: width 0.3s ease;
  }

  .qNumber {
    font-size: 12px;
    color: #2575fc;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .qText {
    font-size: 19px;
    color: #222;
    margin: 8px 0 20px;
    line-height: 1.4;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    padding: 13px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option:hover { border-color: #2575fc; background: #f5f8ff; }
  .option.selected { border-color: #2575fc; background: #e8f0fe; font-weight: 600; }
  .option.correct { border-color: #2ecc71; background: #e8f8ef; font-weight: 600; }
  .option.incorrect { border-color: #e63946; background: #fdeaea; font-weight: 600; }
  .option .letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ddd;
    color: #333;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .option.selected .letter { background: #2575fc; color: #fff; }
  .option.correct .letter { background: #2ecc71; color: #fff; }
  .option.incorrect .letter { background: #e63946; color: #fff; }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 25px;
  }
  .nav-row .btn { margin-top: 0; }

  /* Results */
  .result-score {
    text-align: center;
    font-size: 52px;
    font-weight: 800;
    color: #2575fc;
    margin: 10px 0;
  }
  .result-msg {
    text-align: center;
    font-size: 16px;
    color: #555;
    margin-bottom: 20px;
  }
  .result-stats {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
  }
  .stat-box {
    text-align: center;
  }
  .stat-box .num { font-size: 22px; font-weight: 700; }
  .stat-box .lbl { font-size: 12px; color: #888; }
  .stat-box.correct .num { color: #2ecc71; }
  .stat-box.incorrect .num { color: #e63946; }
  .stat-box.time .num { color: #6a11cb; }

  .review-list {
    max-height: 260px;
    overflow-y: auto;
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 10px;
  }
  .review-item {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid #f2f2f2;
  }
  .review-item .qtitle { font-weight: 600; color: #333; }
  .review-item .ans-ok { color: #2ecc71; }
  .review-item .ans-bad { color: #e63946; }
</style>
</head>
<body>

<div class="card">

  <!-- LOGIN SCREEN -->
  <div class="screen active" id="loginScreen">
    <h1>🧠 BrainSpark Quiz</h1>
    <p class="subtitle">Login to test your knowledge — 10 questions, one shot!</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter any username" autocomplete="off" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter any password" autocomplete="off" required>
      <button type="submit" class="btn">Login &amp; Start Quiz</button>
      <div id="loginError"></div>
    </form>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen" id="quizScreen">
    <div class="quiz-top">
      <span class="userTag" id="userTag"></span>
      <span class="timer" id="timer">00:30</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="qNumber" id="qNumber">Question 1 of 10</div>
    <div class="qText" id="qText"></div>
    <div class="options" id="options"></div>
    <div class="nav-row">
      <button class="btn secondary" id="skipBtn">Skip</button>
      <button class="btn" id="nextBtn" disabled>Next</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="resultScreen">
    <h1>🎉 Quiz Complete!</h1>
    <p class="result-msg" id="resultUser"></p>
    <div class="result-score" id="scoreText">0/10</div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-stats">
      <div class="stat-box correct"><div class="num" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box incorrect"><div class="num" id="incorrectCount">0</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box time"><div class="num" id="timeTaken">0s</div><div class="lbl">Time Used</div></div>
    </div>
    <div class="review-list" id="reviewList"></div>
    <button class="btn" id="restartBtn">Try Again</button>
  </div>

</div>

<script>
/* ---------------- DATA ---------------- */
const questions = [
  { q: "Which planet is known as the Red Planet?", options: ["Venus","Mars","Jupiter","Saturn"], answer: 1 },
  { q: "What does 'HTML' stand for?", options: ["Hyper Trainer Marking Language","HyperText Markup Language","Hyper Text Making Language","HighText Machine Language"], answer: 1 },
  { q: "Which is the largest ocean on Earth?", options: ["Atlantic","Indian","Arctic","Pacific"], answer: 3 },
  { q: "Who wrote the play 'Romeo and Juliet'?", options: ["Charles Dickens","William Shakespeare","Mark Twain","Leo Tolstoy"], answer: 1 },
  { q: "What is the chemical symbol for Gold?", options: ["Go","Gd","Au","Ag"], answer: 2 },
  { q: "Which data structure uses FIFO (First In First Out)?", options: ["Stack","Queue","Tree","Graph"], answer: 1 },
  { q: "How many continents are there on Earth?", options: ["5","6","7","8"], answer: 2 },
  { q: "In JavaScript, which keyword declares a constant variable?", options: ["let","var","const","static"], answer: 2 },
  { q: "What is the powerhouse of the cell?", options: ["Nucleus","Ribosome","Mitochondria","Golgi body"], answer: 2 },
  { q: "Which language is primarily used for styling web pages?", options: ["HTML","CSS","Python","SQL"], answer: 1 },
  { q: "What is the capital city of Japan?", options: ["Seoul","Beijing","Tokyo","Bangkok"], answer: 2 },
  { q: "Which of these is a JavaScript framework/library?", options: ["Laravel","Django","React","Flask"], answer: 2 }
];

const TIME_PER_QUESTION = 30; // seconds

/* ---------------- STATE ---------------- */
let currentUser = "";
let currentIndex = 0;
let score = 0;
let selectedOption = null;
let timeLeft = TIME_PER_QUESTION;
let totalTimeUsed = 0;
let timerInterval = null;
let userAnswers = [];

/* ---------------- ELEMENTS ---------------- */
const loginScreen = document.getElementById('loginScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const userTag = document.getElementById('userTag');

const qNumber = document.getElementById('qNumber');
const qText = document.getElementById('qText');
const optionsDiv = document.getElementById('options');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');
const timerEl = document.getElementById('timer');
const progressFill = document.getElementById('progressFill');

const resultUser = document.getElementById('resultUser');
const scoreText = document.getElementById('scoreText');
const resultMsg = document.getElementById('resultMsg');
const correctCount = document.getElementById('correctCount');
const incorrectCount = document.getElementById('incorrectCount');
const timeTaken = document.getElementById('timeTaken');
const reviewList = document.getElementById('reviewList');
const restartBtn = document.getElementById('restartBtn');

/* ---------------- LOGIN ---------------- */
loginForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (username.length < 2) {
    loginError.textContent = "Username must be at least 2 characters.";
    return;
  }
  if (password.length < 3) {
    loginError.textContent = "Password must be at least 3 characters.";
    return;
  }

  loginError.textContent = "";
  currentUser = username;
  userTag.textContent = "👤 " + currentUser;
  switchScreen(quizScreen);
  startQuiz();
});

/* ---------------- QUIZ FLOW ---------------- */
function startQuiz() {
  currentIndex = 0;
  score = 0;
  totalTimeUsed = 0;
  userAnswers = [];
  loadQuestion();
}

function loadQuestion() {
  selectedOption = null;
  nextBtn.disabled = true;
  nextBtn.textContent = currentIndex === questions.length - 1 ? "Finish" : "Next";

  const q = questions[currentIndex];
  qNumber.textContent = "Question " + (currentIndex + 1) + " of " + questions.length;
  qText.textContent = q.q;
  progressFill.style.width = ((currentIndex) / questions.length * 100) + "%";

  optionsDiv.innerHTML = "";
  const letters = ["A","B","C","D","E","F"];
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = "option";
    div.innerHTML = '<span class="letter">' + letters[idx] + '</span><span>' + opt + '</span>';
    div.addEventListener('click', () => selectOption(idx, div));
    optionsDiv.appendChild(div);
  });

  resetTimer();
}

function selectOption(idx, el) {
  if (selectedOption !== null) return;
  selectedOption = idx;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  nextBtn.disabled = false;
}

function resetTimer() {
  clearInterval(timerInterval);
  timeLeft = TIME_PER_QUESTION;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    totalTimeUsed++;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      recordAnswer(true);
      advance();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  timerEl.textContent = m + ":" + s;
  timerEl.classList.toggle('warning', timeLeft <= 10);
}

skipBtn.addEventListener('click', () => {
  clearInterval(timerInterval);
  totalTimeUsed += (TIME_PER_QUESTION - timeLeft);
  recordAnswer(true);
  advance();
});

nextBtn.addEventListener('click', () => {
  clearInterval(timerInterval);
  totalTimeUsed += (TIME_PER_QUESTION - timeLeft);
  recordAnswer(false);
  advance();
});

function recordAnswer(skipped) {
  const q = questions[currentIndex];
  const isCorrect = !skipped && selectedOption === q.answer;
  if (isCorrect) score++;
  userAnswers.push({
    question: q.q,
    options: q.options,
    correctIdx: q.answer,
    selectedIdx: skipped ? null : selectedOption,
    correct: isCorrect,
    skipped: skipped
  });
}

function advance() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    finishQuiz();
  } else {
    loadQuestion();
  }
}

/* ---------------- RESULTS ---------------- */
function finishQuiz() {
  progressFill.style.width = "100%";
  switchScreen(resultScreen);

  resultUser.textContent = "Great effort, " + currentUser + "!";
  scoreText.textContent = score + " / " + questions.length;

  const pct = Math.round((score / questions.length) * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a genius!";
  else if (pct >= 80) msg = "🌟 Excellent work!";
  else if (pct >= 60) msg = "👍 Good job, keep practicing!";
  else if (pct >= 40) msg = "🙂 Not bad, try again to improve!";
  else msg = "📚 Keep studying — you'll get there!";
  resultMsg.textContent = msg;

  correctCount.textContent = score;
  incorrectCount.textContent = questions.length - score;
  const mins = Math.floor(totalTimeUsed / 60);
  const secs = totalTimeUsed % 60;
  timeTaken.textContent = (mins > 0 ? mins + "m " : "") + secs + "s";

  reviewList.innerHTML = "";
  userAnswers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = "review-item";
    const yourAns = a.skipped || a.selectedIdx === null ? "Skipped / Time up" : a.options[a.selectedIdx];
    const correctAns = a.options[a.correctIdx];
    div.innerHTML =
      '<div class="qtitle">Q' + (i+1) + '. ' + a.question + '</div>' +
      '<div class="' + (a.correct ? 'ans-ok' : 'ans-bad') + '">Your answer: ' + yourAns + '</div>' +
      (a.correct ? '' : '<div class="ans-ok">Correct answer: ' + correctAns + '</div>');
    reviewList.appendChild(div);
  });
}

restartBtn.addEventListener('click', () => {
  switchScreen(loginScreen);
  document.getElementById('username').value = "";
  document.getElementById('password').value = "";
});

/* ---------------- HELPERS ---------------- */
function switchScreen(target) {
  [loginScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
  target.classList.add('active');
}
</script>
</body>
</html>
