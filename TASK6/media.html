<!DOCTYPE html>
<html>
<head>
    <title>Upload Audio and Video</title>
</head>

<body bgcolor="white">

<center>

<h1 style="color:green;">Upload Audio and Video</h1>

<!-- Audio Upload -->
<h2>Upload Nature Audio</h2>

<input type="file" id="audioFile" accept="audio/*"><br><br>

<audio id="audioPlayer" controls></audio>

<br><br><br>

<!-- Video Upload -->
<h2>Upload Eco-Friendly Video</h2>

<input type="file" id="videoFile" accept="video/*"><br><br>

<video id="videoPlayer" width="700" height="400" controls></video>

</center>

<script>
// Audio Upload
document.getElementById("audioFile").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if(file){
        const url = URL.createObjectURL(file);
        document.getElementById("audioPlayer").src = url;
    }
});

// Video Upload
document.getElementById("videoFile").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if(file){
        const url = URL.createObjectURL(file);
        document.getElementById("videoPlayer").src = url;
    }
});
</script>

</body>
</html>
