<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
</head>

<body bgcolor="white">

<center>

<h1 style="color:green;">Contact Us</h1>

<p style="font-size:20px;">
We would love to hear your ideas for protecting our environment.
Please fill out the form below.
</p>

<form>

<table cellpadding="10">

<tr>
<td><b>Name</b></td>
<td><input type="text" size="30" placeholder="Enter your name"></td>
</tr>

<tr>
<td><b>Email</b></td>
<td><input type="email" size="30" placeholder="Enter your email"></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td><b>Favorite Eco Activity</b></td>
<td>
<input type="checkbox"> Tree Plantation<br>
<input type="checkbox"> Recycling<br>
<input type="checkbox"> Save Water<br>
<input type="checkbox"> Clean Environment
</td>
</tr>

<tr>
<td><b>Country</b></td>
<td>
<select>
<option>India</option>
<option>USA</option>
<option>Canada</option>
<option>Australia</option>
</select>
</td>
</tr>

<tr>
<td><b>Suggestions</b></td>
<td>
<textarea rows="5" cols="30" placeholder="Share your ideas..."></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

<hr>

<h2>Useful Website</h2>

<p style="font-size:18px;">
<a href="https://www.unep.org" target="_blank">
United Nations Environment Programme (UNEP)
</a>
</p>

</center>

</body>
</html>
