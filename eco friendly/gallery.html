<!DOCTYPE html>
<html>
<head>
    <title>Eco-Friendly Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f0fff0;
            text-align: center;
        }

        h1{
            color: green;
        }

        p{
            font-size: 20px;
        }

        table{
            margin: auto;
        }

        img{
            width: 300px;
            height: 200px;
            border: 3px solid green;
            border-radius: 10px;
        }

        td{
            padding: 15px;
        }
    </style>
</head>

<body>

<h1>Eco-Friendly Gallery</h1>

<p>
Explore beautiful images that inspire us to protect nature and live sustainably.
</p>

<table>
    <tr>
        <td>
            <img src="nature.jpg" alt="Nature">
            <h3>Beautiful Nature</h3>
        </td>

        <td>
            <img src="trees.jpg" alt="Trees">
            <h3>Plant More Trees</h3>
        </td>
    </tr>

    <tr>
        <td>
            <img src="recycle.jpg" alt="Recycle">
            <h3>Recycle Waste</h3>
        </td>

        <td>
            <img src="earth.jpg" alt="Earth">
            <h3>Save Our Earth</h3>
        </td>
    </tr>
</table>

<br>

<a href="index.html">
    <button style="padding:10px 20px; font-size:16px;">
        Back to Home
    </button>
</a>

</body>
</html>
